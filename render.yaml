services:
  - type: web
    name: crkh-backend
    env: docker
    dockerfilePath: backend/Dockerfile
    dockerContext: backend
    plan: free
    region: oregon
    healthCheckPath: /
    envVars:
      - key: DB_URL
        value: jdbc:mysql://mysql-2c01a104-bk8143116177-55d6.e.aivencloud.com:27465/defaultdb?sslMode=REQUIRED&serverTimezone=UTC&allowPublicKeyRetrieval=true
      - key: DB_USERNAME
        value: avnadmin
      - key: DB_PASSWORD
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JAVA_TOOL_OPTIONS
        value: -Xmx384m -Xms128m
