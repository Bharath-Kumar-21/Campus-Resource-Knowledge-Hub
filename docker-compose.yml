version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: crkh-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: crkh_db
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - crkh-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: crkh-backend
    restart: always
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      - DB_URL=jdbc:mysql://mysql:3306/crkh_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      - DB_USERNAME=root
      - DB_PASSWORD=root
      - JWT_SECRET=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
      - APP_UPLOAD_DIR=uploads/documents
    volumes:
      - crkh_uploads:/app/uploads
    networks:
      - crkh-network

volumes:
  mysql_data:
    driver: local
  crkh_uploads:
    driver: local

networks:
  crkh-network:
    driver: bridge
