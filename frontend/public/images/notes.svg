<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <rect width="400" height="300" fill="#F8F7FD"/>
  <circle cx="200" cy="150" r="110" fill="#F4F1FE"/>
  <!-- Notebook Base -->
  <rect x="130" y="50" width="150" height="200" rx="8" fill="#FFFFFF" stroke="#E8EAF0" stroke-width="2" filter="drop-shadow(0 12px 24px rgba(155,138,251,0.15))"/>
  <!-- Spiral Wire -->
  <g fill="#9B8AFB">
    <circle cx="130" cy="65" r="4"/><circle cx="130" cy="85" r="4"/><circle cx="130" cy="105" r="4"/>
    <circle cx="130" cy="125" r="4"/><circle cx="130" cy="145" r="4"/><circle cx="130" cy="165" r="4"/>
    <circle cx="130" cy="185" r="4"/><circle cx="130" cy="205" r="4"/><circle cx="130" cy="225" r="4"/>
  </g>
  <!-- Note Lines -->
  <rect x="150" y="75" width="110" height="10" rx="3" fill="#EEF2FE"/>
  <text x="154" y="83" font-family="-apple-system, sans-serif" font-size="8" font-weight="700" fill="#6C8EF5">NETWORKS & OSI MODEL</text>
  <line x1="150" y1="105" x2="260" y2="105" stroke="#E8EAF0" stroke-width="2"/>
  <line x1="150" y1="125" x2="260" y2="125" stroke="#E8EAF0" stroke-width="2"/>
  <line x1="150" y1="145" x2="260" y2="145" stroke="#E8EAF0" stroke-width="2"/>
  <line x1="150" y1="165" x2="260" y2="165" stroke="#E8EAF0" stroke-width="2"/>
  <line x1="150" y1="185" x2="260" y2="185" stroke="#E8EAF0" stroke-width="2"/>
  <!-- Diagrams on Page -->
  <rect x="152" y="112" width="40" height="24" rx="4" fill="#F0F9F6" stroke="#79C9B0" stroke-width="1"/>
  <text x="156" y="127" font-family="sans-serif" font-size="7" fill="#79C9B0">TCP Handshake</text>
  <!-- Stylus Pen -->
  <g transform="translate(255, 120) rotate(35)">
    <rect x="0" y="0" width="8" height="110" rx="3" fill="#20242D"/>
    <polygon points="0,110 8,110 4,122" fill="#F59E0B"/>
    <rect x="0" y="8" width="8" height="4" fill="#CBD2DE"/>
  </g>
</svg>
