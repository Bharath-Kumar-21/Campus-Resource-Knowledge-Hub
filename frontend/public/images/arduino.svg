<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <rect width="400" height="300" fill="#F4FAF8"/>
  <circle cx="200" cy="150" r="110" fill="#E8F6F2"/>
  <!-- Arduino PCB Board -->
  <rect x="110" y="70" width="180" height="160" rx="10" fill="#008184" stroke="#006A6D" stroke-width="2" filter="drop-shadow(0 14px 24px rgba(0,129,132,0.2))"/>
  <!-- USB Port (Silver) -->
  <rect x="98" y="85" width="28" height="24" rx="2" fill="#CBD2DE" stroke="#9EA5B3" stroke-width="1.5"/>
  <!-- DC Power Jack (Black) -->
  <rect x="98" y="175" width="30" height="28" rx="3" fill="#20242D"/>
  <!-- Main Microcontroller ATmega328P -->
  <rect x="175" y="145" width="70" height="25" rx="3" fill="#20242D"/>
  <text x="182" y="161" font-family="monospace" font-size="8" fill="#CBD2DE">ATmega328P</text>
  <!-- Pin Headers Top and Bottom -->
  <rect x="145" y="75" width="130" height="12" rx="2" fill="#20242D"/>
  <rect x="145" y="213" width="130" height="12" rx="2" fill="#20242D"/>
  <!-- Reset Button -->
  <rect x="140" y="90" width="12" height="12" rx="2" fill="#EF4444"/>
  <!-- Arduino Infinity Logo -->
  <text x="155" y="125" font-family="-apple-system, sans-serif" font-size="14" font-weight="900" fill="#FFFFFF">ARDUINO UNO</text>
  <circle cx="255" cy="120" r="6" fill="#79C9B0"/>
</svg>
