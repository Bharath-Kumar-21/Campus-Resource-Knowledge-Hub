  <!-- Book Shadow -->
  <path d="M125 240 L260 250 L275 242 L138 232 Z" fill="rgba(32,36,45,0.12)"/>
  <!-- Book Back & Pages -->
  <rect x="135" y="60" width="135" height="175" rx="6" fill="#FFFFFF" stroke="#E8EAF0" stroke-width="2"/>
  <path d="M260 62 L275 68 L275 238 L260 232 Z" fill="#F0F2F6"/>
  <!-- Lines for Pages -->
  <line x1="264" y1="65" x2="264" y2="234" stroke="#D8DEE9" stroke-width="1"/>
  <line x1="268" y1="66" x2="268" y2="235" stroke="#D8DEE9" stroke-width="1"/>
  <line x1="272" y1="67" x2="272" y2="236" stroke="#D8DEE9" stroke-width="1"/>
  <!-- Front Cover -->
  <rect x="130" y="55" width="130" height="180" rx="8" fill="#6C8EF5" filter="drop-shadow(0 10px 20px rgba(108,142,245,0.25))"/>
  <!-- Spine Curve -->
  <path d="M130 55 C125 55 125 235 130 235 Z" fill="#5A7CE6"/>
  <!-- Cover Graphic Accent -->
  <rect x="142" y="70" width="106" height="6" rx="3" fill="#9B8AFB"/>
  <rect x="142" y="85" width="85" height="14" rx="3" fill="#FFFFFF"/>
  <rect x="142" y="105" width="60" height="10" rx="2" fill="rgba(255,255,255,0.85)"/>
  <circle cx="195" cy="160" r="28" fill="#79C9B0" opacity="0.9"/>
  <path d="M180 160 L195 145 L210 160 L195 175 Z" fill="#FFFFFF"/>
  <rect x="142" y="210" width="106" height="4" rx="2" fill="rgba(255,255,255,0.6)"/>
</svg>
