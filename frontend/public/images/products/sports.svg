<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <rect width="400" height="300" fill="#F5FBF8"/>
  <circle cx="200" cy="150" r="110" fill="#E8F7F0"/>
  <!-- Badminton Racquet -->
  <g transform="translate(190, 140) rotate(-35)">
    <ellipse cx="0" cy="-60" rx="42" ry="55" fill="none" stroke="#79C9B0" stroke-width="6"/>
    <!-- Strings -->
    <path d="M-30 -60 L30 -60 M-35 -80 L35 -80 M-35 -40 L35 -40 M0 -105 L0 -15 M-18 -100 L-18 -20 M18 -100 L18 -20" stroke="#CBD2DE" stroke-width="1.5"/>
    <!-- Shaft & Handle -->
    <rect x="-3" y="-5" width="6" height="85" fill="#20242D"/>
    <rect x="-5" y="55" width="10" height="50" rx="3" fill="#6C8EF5"/>
  </g>
  <!-- Feather Shuttlecock -->
  <g transform="translate(250, 160)">
    <path d="M-15 -25 L15 -25 L8 0 L-8 0 Z" fill="#FFFFFF" stroke="#E8EAF0" stroke-width="1.5"/>
    <circle cx="0" cy="6" r="8" fill="#F4B6A6"/>
  </g>
</svg>
