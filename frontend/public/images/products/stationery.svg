<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <rect width="400" height="300" fill="#F6F8FE"/>
  <circle cx="200" cy="150" r="110" fill="#EDF2FD"/>
  <!-- Mini Drafter / Triangle -->
  <polygon points="120,220 280,220 200,90" fill="#FFFFFF" stroke="#6C8EF5" stroke-width="3" filter="drop-shadow(0 10px 20px rgba(108,142,245,0.15))"/>
  <polygon points="155,205 245,205 200,130" fill="#F6F8FE" stroke="#CBD2DE" stroke-width="1.5"/>
  <!-- Compass Divider -->
  <g transform="translate(200, 75)">
    <circle cx="0" cy="0" r="8" fill="#20242D"/>
    <line x1="-3" y1="6" x2="-25" y2="80" stroke="#737A87" stroke-width="4" stroke-linecap="round"/>
    <line x1="3" y1="6" x2="25" y2="80" stroke="#737A87" stroke-width="4" stroke-linecap="round"/>
    <circle cx="-25" cy="80" r="2" fill="#EF4444"/>
    <circle cx="25" cy="80" r="2" fill="#20242D"/>
  </g>
