<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <rect width="400" height="300" fill="#F4F8FD"/>
  <circle cx="200" cy="150" r="110" fill="#EBF4FD"/>
  <!-- Breadboard -->
  <rect x="100" y="80" width="200" height="140" rx="8" fill="#FFFFFF" stroke="#DDE2EC" stroke-width="2" filter="drop-shadow(0 10px 20px rgba(32,36,45,0.08))"/>
