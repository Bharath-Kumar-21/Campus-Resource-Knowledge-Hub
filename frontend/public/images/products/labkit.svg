  <!-- Jumper Wires -->
  <path d="M130 115 C140 70 170 80 180 135" fill="none" stroke="#F59E0B" stroke-width="3" stroke-linecap="round"/>
  <path d="M220 135 C240 170 270 140 280 115" fill="none" stroke="#10B981" stroke-width="3" stroke-linecap="round"/>
