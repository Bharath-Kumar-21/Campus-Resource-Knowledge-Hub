  <line x1="110" y1="92" x2="290" y2="92" stroke="#EF4444" stroke-width="2"/>
  <line x1="110" y1="98" x2="290" y2="98" stroke="#3B82F6" stroke-width="2"/>
  <line x1="110" y1="202" x2="290" y2="202" stroke="#3B82F6" stroke-width="2"/>
  <line x1="110" y1="208" x2="290" y2="208" stroke="#EF4444" stroke-width="2"/>
