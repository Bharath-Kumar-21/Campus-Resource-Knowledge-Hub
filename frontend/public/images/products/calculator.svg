<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <rect width="400" height="300" fill="#F4F6FC"/>
  <circle cx="200" cy="150" r="110" fill="#EEF2FE"/>
  <!-- Calculator Body -->
  <rect x="135" y="45" width="130" height="210" rx="16" fill="#20242D" filter="drop-shadow(0 12px 24px rgba(32,36,45,0.15))"/>
  <!-- Solar Panel & Logo -->
  <rect x="150" y="60" width="100" height="18" rx="4" fill="#323846"/>
  <rect x="210" y="63" width="34" height="12" rx="2" fill="#583A2E"/>
  <text x="154" y="73" font-family="-apple-system, sans-serif" font-size="8" font-weight="700" fill="#9FA6B3">CASIO fx-991EX</text>
  <!-- LCD Screen -->
  <rect x="150" y="85" width="100" height="42" rx="6" fill="#B4C7B9"/>
  <rect x="153" y="88" width="94" height="36" rx="4" fill="#C2D5C7"/>
  <text x="158" y="103" font-family="monospace" font-size="9" fill="#1C2E24">∫[0→π] sin(x)dx</text>
  <text x="226" y="118" font-family="monospace" font-size="14" font-weight="700" fill="#1C2E24">= 2</text>
  <!-- Function Keys -->
  <rect x="150" y="134" width="18" height="10" rx="3" fill="#6C8EF5"/>
  <rect x="177" y="134" width="18" height="10" rx="3" fill="#79C9B0"/>
  <rect x="204" y="134" width="18" height="10" rx="3" fill="#9B8AFB"/>
  <rect x="231" y="134" width="18" height="10" rx="3" fill="#F4B6A6"/>
  <!-- Keypad Grid -->
  <g fill="#434B5C">
    <rect x="150" y="150" width="18" height="14" rx="3"/>
    <rect x="177" y="150" width="18" height="14" rx="3"/>
    <rect x="204" y="150" width="18" height="14" rx="3"/>
    <rect x="231" y="150" width="18" height="14" rx="3"/>
    <rect x="150" y="170" width="18" height="14" rx="3"/>
    <rect x="177" y="170" width="18" height="14" rx="3"/>
    <rect x="204" y="170" width="18" height="14" rx="3"/>
    <rect x="231" y="170" width="18" height="14" rx="3"/>
    <rect x="150" y="190" width="18" height="14" rx="3"/>
    <rect x="177" y="190" width="18" height="14" rx="3"/>
    <rect x="204" y="190" width="18" height="14" rx="3"/>
    <rect x="231" y="190" width="18" height="14" rx="3"/>
    <rect x="150" y="210" width="18" height="14" rx="3"/>
    <rect x="177" y="210" width="18" height="14" rx="3"/>
    <rect x="204" y="210" width="18" height="14" rx="3"/>
    <rect x="231" y="210" width="18" height="14" rx="3"/>
    <rect x="150" y="230" width="45" height="14" rx="3" fill="#6C8EF5"/>
    <rect x="204" y="230" width="45" height="14" rx="3" fill="#79C9B0"/>
  </g>
</svg>
