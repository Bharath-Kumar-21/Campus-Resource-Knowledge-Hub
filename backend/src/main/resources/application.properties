spring.application.name=crkh-backend
server.port=8080

# Database Configuration (MySQL crkh_db)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/crkh_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Thymeleaf
spring.thymeleaf.prefix=
spring.thymeleaf.cache=false
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8

# File Upload (Knowledge Vault)
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=25MB
app.upload.dir=uploads/documents

# JWT Security Configuration
jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
jwt.expiration=86400000
jwt.refresh-expiration=604800000

# QR Token Configuration
app.qr.expiration-minutes=30

# Matching Engine Configurable Weights
app.matching.weight.relevance=0.30
app.matching.weight.location=0.20
app.matching.weight.availability=0.20
app.matching.weight.reputation=0.15
app.matching.weight.recency=0.10
app.matching.weight.history=0.05

# Logging
logging.level.app=INFO
logging.level.org.springframework.security=WARN
