<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Resource — CRKH Campus Exchange</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <div th:replace="~{fragments/navbar :: header('resources')}"></div>

    <main class="container" style="max-width:780px; padding-top:2.5rem; padding-bottom:4rem;">
        <div style="margin-bottom:1.5rem;">
            <a th:href="@{'/resources/' + ${resource.id}}" class="btn btn-secondary btn-sm" style="display:inline-flex; align-items:center; gap:0.4rem;">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="15 18 9 12 15 6"/></svg>
                Back to Resource Details
            </a>
        </div>

        <div class="glass-card" style="padding:2.5rem; position:relative; overflow:hidden;">
            <!-- Caustic specular rim -->
            <div style="display:flex; align-items:center; gap:1rem; margin-bottom:1.75rem;">
                <div style="width:48px; height:48px; border-radius:14px; background:linear-gradient(135deg, rgba(108,142,245,0.18), rgba(155,138,251,0.18)); border:1px solid rgba(108,142,245,0.3); display:grid; place-items:center; color:var(--accent-blue); font-size:1.4rem;">
                    ✎
                </div>
                <div>
                    <h1 style="font-size:1.75rem; font-weight:800; color:var(--text-main); letter-spacing:-0.03em; margin:0;">Edit Resource & Exchange Terms</h1>
                    <p style="font-size:0.9rem; color:var(--text-muted); margin:0.25rem 0 0 0;">Update exchange requirements, photos, condition, or availability dates</p>
                </div>
            </div>

            <form th:action="@{'/resources/' + ${resource.id} + '/edit'}" method="post" enctype="multipart/form-data">
                <div class="form-group">
                    <label class="form-label" for="title">Resource Title *</label>
                    <input type="text" id="title" name="title" class="form-control" th:value="${resource.title}" required>
                </div>

                <div style="display:grid; grid-template-columns:1fr 1fr; gap:1.25rem;">
                    <div class="form-group">
                        <label class="form-label" for="category">Category *</label>
                        <select id="category" name="category" class="form-control" required>
                            <option th:each="cat : ${categories}" th:value="${cat}" th:text="${cat}" th:selected="${cat == resource.category}">CATEGORY</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label class="form-label" for="itemCondition">Physical Condition</label>
                        <select id="itemCondition" name="itemCondition" class="form-control">
                            <option value="Like New" th:selected="${resource.itemCondition == 'Like New'}">Like New (Mint)</option>
                            <option value="Excellent" th:selected="${resource.itemCondition == 'Excellent'}">Excellent (Minor cosmetic)</option>
                            <option value="Good" th:selected="${resource.itemCondition == 'Good'}">Good (Fully functional)</option>
                            <option value="Fair" th:selected="${resource.itemCondition == 'Fair'}">Fair (Well used)</option>
                        </select>
                    </div>
                </div>

                <!-- Product Photo Upload / Update -->
                <div class="form-group" style="background:rgba(255,255,255,0.5); border:2px dashed rgba(108,142,245,0.35); border-radius:18px; padding:1.5rem; text-align:center;">
                    <label class="form-label" style="margin-bottom:0.4rem; display:block; font-weight:700;">
                        📸 Update Product Photo
                    </label>
                    <p style="font-size:0.85rem; color:var(--text-muted); margin:0 0 1rem 0;">Upload a replacement image from your device</p>

                    <input type="file" id="imageFile" name="imageFile" accept="image/*" class="form-control" style="max-width:320px; margin:0 auto 0.75rem auto;">

                    <div style="font-size:0.8rem; color:var(--text-dim); margin-top:0.75rem;">
                        Or image URL:
                        <input type="url" id="imageUrl" name="imageUrl" class="form-control" th:value="${resource.imageUrl}" style="margin-top:0.35rem; font-size:0.85rem;" placeholder="https://...">
                    </div>
                </div>

                <!-- Mutual Exchange & Satisfaction Terms -->
                <div style="background:linear-gradient(135deg, rgba(108,142,245,0.06), rgba(155,138,251,0.06)); border:1px solid rgba(108,142,245,0.25); border-radius:18px; padding:1.5rem; margin-bottom:1.5rem;">
                    <div style="display:flex; align-items:center; gap:0.6rem; margin-bottom:0.75rem;">
                        <span style="font-size:1.2rem;">🤝</span>
                        <h3 style="font-size:1.05rem; font-weight:800; color:var(--text-main); margin:0;">Exchange & Sharing Terms</h3>
                    </div>

                    <div class="form-group">
                        <label class="form-label" for="sharingType">Sharing / Exchange Mode *</label>
                        <select id="sharingType" name="sharingType" class="form-control">
                            <option value="FREE_BORROW" th:selected="${resource.sharingType == 'FREE_BORROW'}">🌿 Free Campus Borrow (Goodwill loan)</option>
                            <option value="ITEM_EXCHANGE" th:selected="${resource.sharingType == 'ITEM_EXCHANGE'}">🔄 Direct Item Exchange (Swap for other gear)</option>
                            <option value="SKILL_SWAP" th:selected="${resource.sharingType == 'SKILL_SWAP'}">💡 Skill / Knowledge Swap (Tutoring / code review)</option>
                            <option value="SECURITY_PLEDGE" th:selected="${resource.sharingType == 'SECURITY_PLEDGE'}">🛡️ Refundable Security Pledge (Deposit/ID collateral)</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label class="form-label" for="exchangePreference">What do you want in exchange? *</label>
                        <input type="text" id="exchangePreference" name="exchangePreference" class="form-control" th:value="${resource.exchangePreference}" placeholder="e.g. Looking to swap for OS Textbook or TI-84 calculator">
                    </div>

                    <div class="form-group">
                        <label class="form-label" for="satisfactionTerms">Mutual Satisfaction & Verification Terms</label>
                        <input type="text" id="satisfactionTerms" name="satisfactionTerms" class="form-control" th:value="${resource.satisfactionTerms}" placeholder="e.g. Physical inspection on handover; both confirm working condition">
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label" for="location">Pickup Location on Campus *</label>
                    <input type="text" id="location" name="location" class="form-control" th:value="${resource.location}" required>
                </div>

                <div style="display:grid; grid-template-columns:1fr 1fr; gap:1.25rem;">
                    <div class="form-group">
                        <label class="form-label" for="availabilityFrom">Available From *</label>
                        <input type="date" id="availabilityFrom" name="availabilityFrom" class="form-control" th:value="${resource.availabilityFrom}" required>
                    </div>
                    <div class="form-group">
                        <label class="form-label" for="availabilityTo">Available Until *</label>
                        <input type="date" id="availabilityTo" name="availabilityTo" class="form-control" th:value="${resource.availabilityTo}" required>
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label" for="description">Detailed Description & Included Accessories</label>
                    <textarea id="description" name="description" class="form-control" rows="3" th:text="${resource.description}"></textarea>
                </div>

                <div style="display:flex; justify-content:flex-end; gap:0.75rem; margin-top:1.5rem;">
                    <a th:href="@{'/resources/' + ${resource.id}}" class="btn btn-secondary">Cancel</a>
                    <button type="submit" class="btn btn-primary" style="padding:0.8rem 2rem; font-weight:700;">
                        Save Exchange Changes
                    </button>
                </div>
            </form>
        </div>
    </main>

    <footer class="footer">
        <p>© 2026 Campus Resource & Knowledge Hub (CRKH) • Liquid Glass Interface</p>
    </footer>

    <script th:src="@{/js/main.js}"></script>
</body>
</html>
