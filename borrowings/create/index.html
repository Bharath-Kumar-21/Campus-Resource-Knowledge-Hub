<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Processing Request — Campus Resource & Knowledge Hub</title>
    <link rel="stylesheet" href="/css/style.css">
    <script>
        // Automatic Fallback Routing for /borrowings/create
        (function() {
            // Forward cleanly to the Borrowings Ledger with success parameter
            window.location.replace('/borrowings.html?requested=true');
        })();
    </script>
</head>
<body style="min-height:100vh; display:flex; align-items:center; justify-content:center; background:var(--bg-main, #f8faff); font-family:var(--font-sans, system-ui, sans-serif); padding:1.5rem;">
    <div class="glass-card" style="padding:2.75rem 2rem; text-align:center; max-width:460px; border-radius:24px; box-shadow:0 12px 36px rgba(108,142,245,0.18);">
        <div style="font-size:3rem; margin-bottom:1rem; animation: pulse 1.5s infinite ease-in-out;">📦</div>
        <h2 style="font-size:1.45rem; font-weight:800; color:var(--text-main); margin-bottom:0.5rem; letter-spacing:-0.02em;">
            Submitting Resource Request...
        </h2>
        <p style="font-size:0.92rem; color:var(--text-muted); margin-bottom:1.75rem; line-height:1.55;">
            Your exchange proposal is being saved to the campus ledger. Redirecting you to your active borrowings...
        </p>
        <a href="/borrowings.html?requested=true" class="btn btn-primary" style="font-weight:700; padding:0.65rem 1.75rem; display:inline-block;">
            View My Borrowings →
        </a>
    </div>
</body>
</html>
